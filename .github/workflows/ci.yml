name: CI

# Sprint 1 deliverable (docs/sprint-1.md, architecture.md §15): "lint,
# typecheck, build, and gated forward-only migrations." `verify` runs on
# every push/PR against a throwaway Postgres service — migrations must
# apply cleanly before build even runs, which is the "gate." The
# `migrate-production` job then re-applies the same forward-only
# migrations to the real database, but only after `verify` passes on
# `main`, which is what makes it "gated" rather than a direct push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret, CI-only values — never used against a real database and
  # never containing real user data. Real deployments get their own
  # values from Vercel project environment variables (see README.md
  # "Deployment").
  AUTH_SECRET: ci-placeholder-auth-secret-not-for-production-use-only
  ENCRYPTION_MASTER_KEY: X7t7htFVfohBPedQqc72PkVcAmvxWGM7CltvHZBov0I=
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/leadmap_ci

jobs:
  verify:
    name: Lint, typecheck, migrate, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadmap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply migrations (gate)
        run: npm run db:migrate

      - name: Build
        run: npm run build

  migrate-production:
    name: Apply migrations to production
    # PRODUCTION_DATABASE_URL must be a repository secret, not an
    # environment secret — environment secrets aren't resolved until
    # the job actually starts, and this job's `environment: production`
    # gate means they wouldn't be available until it's already running.
    # `environment: production` below is still worth configuring (for
    # protection rules / deployment history); just add the secret at
    # the repo level too. See README.md "Deployment" for the full list
    # of secrets this workflow expects.
    #
    # Whether that secret is actually *configured* can't be checked in
    # an `if:` at all — the `secrets` context isn't available to any
    # `if:` condition, job- or step-level (confirmed with `actionlint`,
    # which is also what reported "Unrecognized named-value: 'secrets'"
    # for this job's `if:` before this fix). Valid contexts there are
    # `env`, `github`, `inputs`, `job`, `matrix`, `needs`, `runner`,
    # `steps`, `strategy`, `vars` — no `secrets`. So the secret is piped
    # into the job-level `env:` below instead (`env:` *can* reference
    # `secrets`), and the migration step's `if:` checks that `env` var.
    # The job itself always runs on a push to main; the step — and so
    # the actual migration — is skipped, not failed, when the secret
    # isn't configured.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply forward-only migrations to production
        if: env.PRODUCTION_DATABASE_URL != ''
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.PRODUCTION_DATABASE_URL }}
