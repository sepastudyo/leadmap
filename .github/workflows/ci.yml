name: CI

# Sprint 1 deliverable (docs/sprint-1.md, architecture.md §15): "lint,
# typecheck, build, and gated forward-only migrations." `verify` runs on
# every push/PR against a throwaway Postgres service — migrations must
# apply cleanly before build even runs, which is the "gate." The
# `migrate-production` job then re-applies the same forward-only
# migrations to the real database, but only after `verify` passes on
# `main`, which is what makes it "gated" rather than a direct push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret, CI-only values — never used against a real database and
  # never containing real user data. Real deployments get their own
  # values from Vercel project environment variables (see README.md
  # "Deployment").
  AUTH_SECRET: ci-placeholder-auth-secret-not-for-production-use-only
  ENCRYPTION_MASTER_KEY: X7t7htFVfohBPedQqc72PkVcAmvxWGM7CltvHZBov0I=
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/leadmap_ci

jobs:
  verify:
    name: Lint, typecheck, migrate, build
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS is required by migration 0002 (`CREATE EXTENSION
        # postgis`, backing `businesses.location` per architecture.md
        # §5/§5.2) but is not bundled in the plain `postgres` image —
        # this was the actual root cause the drizzle-kit CLI bug above
        # was hiding ("extension \"postgis\" is not available"), only
        # visible once the migration step's real error was exposed.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadmap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply migrations (gate)
        # `drizzle-kit migrate` itself is not used here: its CLI wraps
        # every migration in `hanji`'s `renderWithTask`, which on
        # failure calls `process.exit(1)` from inside its own catch
        # block before the error ever reaches the CLI's outer
        # `console.error` — the migration view's `render()` also
        # ignores the error object it's given, so the only output on
        # failure is the same "applying migrations..." spinner text
        # seen in a failed run, then exit code 1, with the real
        # Postgres error never printed anywhere. This calls the same
        # `drizzle-orm/postgres-js/migrator` primitive drizzle-kit's
        # CLI uses internally, directly, with a plain try/catch so the
        # real error (query, params, and cause — e.g. syntax errors,
        # constraint violations, connection failures) is always logged.
        run: |
          cat > ./.ci-migrate.cjs <<'NODE_SCRIPT'
          const postgres = require("postgres");
          const { drizzle } = require("drizzle-orm/postgres-js");
          const { migrate } = require("drizzle-orm/postgres-js/migrator");

          async function main() {
            const client = postgres(process.env.DATABASE_URL, { max: 1 });
            const transparent = (value) => value;
            for (const oid of ["1184", "1082", "1083", "1114"]) {
              client.options.parsers[oid] = transparent;
              client.options.serializers[oid] = transparent;
            }
            client.options.serializers["114"] = transparent;
            client.options.serializers["3802"] = transparent;

            const db = drizzle(client);
            try {
              await migrate(db, { migrationsFolder: "./db/migrations" });
              console.log("Migrations applied successfully.");
            } finally {
              await client.end({ timeout: 1 });
            }
          }

          main().catch((err) => {
            console.error("Migration failed:");
            console.error(err);
            process.exitCode = 1;
          });
          NODE_SCRIPT
          node ./.ci-migrate.cjs
          rm -f ./.ci-migrate.cjs

      - name: Build
        run: npm run build

  migrate-production:
    name: Apply migrations to production
    # PRODUCTION_DATABASE_URL must be a repository secret, not an
    # environment secret — environment secrets aren't resolved until
    # the job actually starts, and this job's `environment: production`
    # gate means they wouldn't be available until it's already running.
    # `environment: production` below is still worth configuring (for
    # protection rules / deployment history); just add the secret at
    # the repo level too. See README.md "Deployment" for the full list
    # of secrets this workflow expects.
    #
    # Whether that secret is actually *configured* can't be checked in
    # an `if:` at all — the `secrets` context isn't available to any
    # `if:` condition, job- or step-level (confirmed with `actionlint`,
    # which is also what reported "Unrecognized named-value: 'secrets'"
    # for this job's `if:` before this fix). Valid contexts there are
    # `env`, `github`, `inputs`, `job`, `matrix`, `needs`, `runner`,
    # `steps`, `strategy`, `vars` — no `secrets`. So the secret is piped
    # into the job-level `env:` below instead (`env:` *can* reference
    # `secrets`), and the migration step's `if:` checks that `env` var.
    # The job itself always runs on a push to main; the step — and so
    # the actual migration — is skipped, not failed, when the secret
    # isn't configured.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply forward-only migrations to production
        # Same rationale as the `verify` job's "Apply migrations (gate)"
        # step: bypasses drizzle-kit CLI's error-swallowing bug in
        # `hanji`'s `renderWithTask`/`MigrateProgress.render()` by
        # calling the same underlying `drizzle-orm/postgres-js/migrator`
        # primitive directly, with a plain try/catch that always prints
        # the real error.
        if: env.PRODUCTION_DATABASE_URL != ''
        run: |
          cat > ./.ci-migrate.cjs <<'NODE_SCRIPT'
          const postgres = require("postgres");
          const { drizzle } = require("drizzle-orm/postgres-js");
          const { migrate } = require("drizzle-orm/postgres-js/migrator");

          async function main() {
            const client = postgres(process.env.DATABASE_URL, { max: 1 });
            const transparent = (value) => value;
            for (const oid of ["1184", "1082", "1083", "1114"]) {
              client.options.parsers[oid] = transparent;
              client.options.serializers[oid] = transparent;
            }
            client.options.serializers["114"] = transparent;
            client.options.serializers["3802"] = transparent;

            const db = drizzle(client);
            try {
              await migrate(db, { migrationsFolder: "./db/migrations" });
              console.log("Migrations applied successfully.");
            } finally {
              await client.end({ timeout: 1 });
            }
          }

          main().catch((err) => {
            console.error("Migration failed:");
            console.error(err);
            process.exitCode = 1;
          });
          NODE_SCRIPT
          node ./.ci-migrate.cjs
          rm -f ./.ci-migrate.cjs
        env:
          DATABASE_URL: ${{ env.PRODUCTION_DATABASE_URL }}
